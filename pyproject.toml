[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF", "PIE", "RET", "PERF", "PL", "ASYNC", "LOG", "PTH"]
ignore = [
    "PLR2004", # raw shadow values are named where their meaning matters
    "PLR0913", # entities take coordinator, device, description and property
    "PLC0415", # tests import inside the test that needs it
    "RUF012",  # Home Assistant entity attributes (_attr_*) are plain class lists by convention
]

[tool.ruff.lint.per-file-ignores]
# Tests wait for the MQTT network thread by polling with a timeout
"tests/*" = ["ASYNC109", "ASYNC110"]
